name: CI

# Lint, type-check, and build on every push and PR. Pair this with branch
# protection (require the "build" check) so broken code can't reach `main` -
# and since Vercel auto-deploys `main` to production, that keeps prod green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Dependency vulnerability audit
        # Fail only on high/critical advisories; informational below that. (F335)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2 # secret scanning (F287)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
