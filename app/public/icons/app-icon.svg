<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PB Card Deck - Pickleball Cards">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0b6b4f"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffc107"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- playing card, tilted -->
  <g transform="rotate(-14 244 252)">
    <rect x="126" y="104" width="208" height="296" rx="28" fill="#0a3d2c" opacity="0.18"/>
    <rect x="120" y="96" width="208" height="296" rx="28" fill="#ffffff"/>
    <path d="M162 150 l16 22 -16 22 -16 -22 z" fill="#0b6b4f"/>
    <path d="M286 314 l16 22 -16 22 -16 -22 z" fill="#0b6b4f" opacity="0.55"/>
  </g>

  <!-- pickleball, overlapping the card's lower-right -->
  <circle cx="348" cy="356" r="116" fill="#0a3d2c" opacity="0.18"/>
  <circle cx="344" cy="350" r="114" fill="url(#ball)"/>
  <g fill="#c47d00">
    <circle cx="344" cy="298" r="14"/>
    <circle cx="298" cy="332" r="14"/>
    <circle cx="390" cy="332" r="14"/>
    <circle cx="316" cy="382" r="14"/>
    <circle cx="372" cy="382" r="14"/>
    <circle cx="344" cy="350" r="14"/>
    <circle cx="344" cy="404" r="14"/>
  </g>
</svg>
